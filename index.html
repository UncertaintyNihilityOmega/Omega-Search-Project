<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Omega Search</title>
<meta name="description" content="A quiet white search page. Click anywhere to leave a mark.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f6f7f9;
    --line: #e5e7ed;
    --line-strong: #cfd3dd;
    --ink: #15161b;
    --ink-soft: #676c78;
    --ink-faint: #9ca2ae;
    --sans: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    padding-inline: 20px;
    padding-block: 32px 24px;
    -webkit-font-smoothing: antialiased;
  }

  #layer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  main {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    width: 100%;
    max-width: 600px;
    margin-inline: auto;
  }

  .brand {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: 27px;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .brand .glyph {
    font-size: 1.22em;
    margin-right: 0.12em;
    vertical-align: -0.04em;
  }

  form { width: 100%; }

  .bar {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 54px;
    padding: 0 8px 0 20px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 27px;
    transition: border-color 0.18s ease, box-shadow 0.18s ease;
  }

  .bar:focus-within {
    border-color: var(--line-strong);
    box-shadow: 0 1px 2px rgba(21, 22, 27, 0.04), 0 10px 28px -10px rgba(21, 22, 27, 0.18);
  }

  .bar .magnifier {
    flex: none;
    width: 18px;
    height: 18px;
    color: var(--ink-faint);
  }

  #q {
    flex: 1;
    min-width: 0;
    height: 100%;
    border: none;
    outline: none;
    background: transparent;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
  }

  #q::placeholder { color: var(--ink-faint); }
  #q::-webkit-search-cancel-button { display: none; }

  .go {
    flex: none;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease;
  }

  .go:hover { background: var(--ink); color: #fff; }
  .go svg { width: 16px; height: 16px; }

  .engines {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }

  .chip {
    padding: 7px 15px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--bg);
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.16s ease, color 0.16s ease, background 0.16s ease;
  }

  .chip:hover { border-color: var(--line-strong); color: var(--ink); }

  .chip[aria-pressed="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
  }

  .hint {
    margin: 0;
    font-family: var(--serif);
    font-style: italic;
    font-size: 15px;
    color: var(--ink-faint);
  }

  footer {
    position: relative;
    z-index: 2;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding-top: 24px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  #dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-faint);
    transition: background 0.3s ease;
  }

  :focus-visible {
    outline: 2px solid var(--ink);
    outline-offset: 3px;
  }

  .affirm {
    position: absolute;
    max-width: min(68vw, 440px);
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(21px, 3.2vw, 33px);
    line-height: 1.16;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .affirm .rest { visibility: hidden; }

  .affirm.typing .shown {
    border-right: 2px solid currentColor;
    margin-right: -2px;
  }

  .ripple {
    position: absolute;
    width: 14px;
    height: 14px;
    margin: -7px 0 0 -7px;
    border: 1.5px solid currentColor;
    border-radius: 50%;
  }
</style>
</head>
<body>

<div id="layer" aria-hidden="true"></div>

<main>
  <h1 class="brand"><span class="glyph">&Omega;</span>Omega Search</h1>

  <form id="form" class="ui" autocomplete="off">
    <div class="bar">
      <svg class="magnifier" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="q" type="search" enterkeyhint="search" placeholder="Search the web" aria-label="Search query" autofocus>
      <button class="go" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="13 6 19 12 13 18"></polyline>
        </svg>
      </button>
    </div>
  </form>

  <div id="engines" class="engines ui" role="group" aria-label="Search engine"></div>

  <p class="hint">click anywhere &middot; tab to switch</p>
</main>

<footer class="ui">
  <span id="dot"></span>
  <span id="browser-label">detecting browser&hellip;</span>
</footer>

<script>
// Edit freely — these are the phrases that appear where you click.
const AFFIRMATIONS = [
  "I'm Curious",
  "I Love to Learn",
  "Building a Beautiful Future Together",
  "Let's Cook!",
  "I Love Tessa",
  "Keep Going",
  "One Step at a Time",
  "Make Something Today",
  "Ask Better Questions",
  "The Best Is Ahead",
  "Build It Anyway",
  "Stay Soft, Stay Sharp"
];

// Edit freely — add any engine whose search URL ends with the query.
const ENGINES = [
  { id: "google",    name: "Google",    url: "https://www.google.com/search?q=" },
  { id: "brave",     name: "Brave",     url: "https://search.brave.com/search?q=" },
  { id: "youtube",   name: "YouTube",   url: "https://www.youtube.com/results?search_query=" },
  { id: "github",    name: "GitHub",    url: "https://github.com/search?q=" },
  { id: "wikipedia", name: "Wikipedia", url: "https://en.wikipedia.org/w/index.php?search=" }
];

const form = document.getElementById("form");
const input = document.getElementById("q");
const enginesEl = document.getElementById("engines");
const layer = document.getElementById("layer");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let active = 0;
try {
  const saved = ENGINES.findIndex(e => e.id === localStorage.getItem("omega-engine"));
  if (saved > -1) active = saved;
} catch {}

ENGINES.forEach((engine, i) => {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "chip";
  chip.textContent = engine.name;
  chip.addEventListener("click", () => select(i));
  enginesEl.appendChild(chip);
});

function select(i) {
  active = (i + ENGINES.length) % ENGINES.length;
  [...enginesEl.children].forEach((chip, n) => chip.setAttribute("aria-pressed", String(n === active)));
  input.placeholder = "Search " + ENGINES[active].name;
  try { localStorage.setItem("omega-engine", ENGINES[active].id); } catch {}
}
select(active);

form.addEventListener("submit", e => {
  e.preventDefault();
  const query = input.value.trim();
  if (!query) return;
  const url = ENGINES[active].url + encodeURIComponent(query);
  if (!window.open(url, "_blank", "noopener")) location.href = url;
});

input.addEventListener("keydown", e => {
  if (e.key === "Tab") {
    e.preventDefault();
    select(active + (e.shiftKey ? -1 : 1));
  } else if (e.key === "Escape") {
    input.blur();
  }
});

const live = [];

function affirm(x, y) {
  const color = `hsl(${Math.floor(Math.random() * 360)} 72% 43%)`;
  const text = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];

  const ring = document.createElement("div");
  ring.className = "ripple";
  ring.style.cssText += `left:${x}px;top:${y}px;color:${color}`;
  layer.appendChild(ring);
  ring.animate(
    [{ transform: "scale(.4)", opacity: .55 }, { transform: "scale(3.4)", opacity: 0 }],
    { duration: reduce ? 0 : 680, easing: "cubic-bezier(.16,1,.3,1)" }
  ).finished.then(() => ring.remove(), () => ring.remove());

  const el = document.createElement("div");
  el.className = "affirm typing";
  el.style.color = color;
  const shown = document.createElement("span");
  shown.className = "shown";
  const rest = document.createElement("span");
  rest.className = "rest";
  rest.textContent = text;
  el.append(shown, rest);
  el.style.transform = `translateY(-50%) rotate(${(Math.random() * 6 - 3).toFixed(2)}deg)`;
  el.style.left = x + "px";
  el.style.top = y + "px";
  layer.appendChild(el);

  const box = el.getBoundingClientRect();
  let nx = x, ny = y;
  if (box.right > innerWidth - 16) nx -= box.right - (innerWidth - 16);
  if (box.left < 16) nx += 16 - box.left;
  if (box.bottom > innerHeight - 16) ny -= box.bottom - (innerHeight - 16);
  if (box.top < 16) ny += 16 - box.top;
  el.style.left = nx + "px";
  el.style.top = ny + "px";

  requestAnimationFrame(() => { el.style.opacity = "1"; });

  live.push(el);
  while (live.length > 12) retire(live.shift());

  let i = 0;
  const step = () => {
    if (!el.isConnected) return;
    i++;
    shown.textContent = text.slice(0, i);
    rest.textContent = text.slice(i);
    if (i < text.length) {
      setTimeout(step, 42);
    } else {
      el.classList.remove("typing");
      setTimeout(() => retire(el), 1400);
    }
  };
  if (reduce) {
    shown.textContent = text;
    rest.textContent = "";
    el.classList.remove("typing");
    setTimeout(() => retire(el), 1600);
  } else {
    setTimeout(step, 90);
  }
}

function retire(el) {
  if (!el || !el.isConnected) return;
  const at = live.indexOf(el);
  if (at > -1) live.splice(at, 1);
  el.style.transition = "opacity .7s ease";
  el.style.opacity = "0";
  setTimeout(() => el.remove(), 750);
}

addEventListener("pointerdown", e => {
  if (e.target.closest(".ui")) return;
  affirm(e.clientX, e.clientY);
  if (matchMedia("(hover: hover)").matches) input.focus();
});

(async () => {
  const ua = navigator.userAgent;
  const brands = navigator.userAgentData?.brands?.map(b => b.brand).join(" ") ?? "";
  let found = { name: "", color: "" };

  try {
    if (navigator.brave && await navigator.brave.isBrave()) found = { name: "Brave", color: "#fb542b" };
  } catch {}

  if (!found.name) {
    if (/Microsoft Edge/.test(brands) || /Edg\//.test(ua)) found = { name: "Edge", color: "#0f7ebf" };
    else if (/Opera|OPR/.test(brands + ua)) found = { name: "Opera", color: "#ff1b2d" };
    else if (/Firefox\//.test(ua)) found = { name: "Firefox", color: "#ff7139" };
    else if (/Google Chrome/.test(brands) || /Chrome\//.test(ua)) found = { name: "Chrome", color: "#4285f4" };
    else if (/Safari\//.test(ua) && /Apple/.test(navigator.vendor)) found = { name: "Safari", color: "#1b88ff" };
  }

  document.getElementById("browser-label").textContent =
    found.name ? `results open in ${found.name}` : "results open in a new tab";
  if (found.color) document.getElementById("dot").style.background = found.color;
})();
</script>

</body>
</html>
